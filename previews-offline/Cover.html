<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<title>TOU</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--bg-page); color:var(--text); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .primary { fill:var(--primary); }
  .tint { fill:var(--primary-200); }
  .deep { fill:var(--ink-950); }
  .b1 { fill:var(--brand-blue); }
  .b2 { fill:var(--brand-cyan); }
  .b3 { fill:var(--brand-teal); }
  .slab { rx:var(--radius-xl); }
  .band { rx:var(--radius-md); }
  .chip { rx:20px; } /* pill: half of the 40px short side (radius-pill) */
  .arc { fill:none; stroke-width:var(--space-2); stroke-linecap:butt; }
  .arc.u { stroke:var(--brand-cyan); }
  .arc.n { stroke:var(--brand-teal); }
  /* the dark product ground (#121212) swallows ink-950: lift the slab to the dark surface ladder's top step */
  [data-theme="dark"] .deep { fill:var(--gray-800); }
  .words { position:absolute; left:var(--space-8); bottom:var(--space-8); max-width:440px; }
  .name { margin:0; font-size:120px; line-height:.9; font-weight:600; letter-spacing:-.03em; color:var(--text); }
  .tag { margin:var(--space-3) 0 0 6px; font-size:14px; line-height:20px; color:var(--text-secondary); }
</style>
<link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components/bundle.css"><script src="vendor/react.production.min.js"></script><script src="vendor/react-dom.production.min.js"></script><script src="../components/bundle.js"></script></head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      primary 152×232 bled off the top (the one interface blue, largest) · ink-950 312×232 bled off right and bottom (the navy of the site's dark sections; gray-800 in dark) · brand-blue/brand-cyan/brand-teal as three unequal bands bled off the top, the logo gradient as solid stops · primary-200 pill as the tint · ≈40% of 960×288
  arrangement one tall primary slab with a navy field beside it, the brand strip running across the top of the field like the gradient over the hero
  pattern     arcs, from the logo's two-arc symbol ("o símbolo de dois arcos"): open half-rings in brand-cyan (down) and brand-teal (up) offset by a step, two rows across the navy field — the accent living on navy, as the README says
  scales      sides in space-2 multiples; gutters space-4; arc radius radius-xl, stroke space-2, pitch space-20; corners radius-xl (slabs), radius-md (bands), pill rx = half the short side
-->
<rect class="primary slab" x="16" y="-16" width="152" height="232" rx="16"/>
<rect class="tint chip" x="16" y="232" width="152" height="40" rx="20"/>
<rect class="deep slab" x="184" y="72" width="312" height="232" rx="16"/>
<rect class="b1 band" x="184" y="-16" width="136" height="72" rx="8"/>
<rect class="b2 band" x="328" y="-16" width="88" height="72" rx="8"/>
<rect class="b3 band" x="424" y="-16" width="72" height="72" rx="8"/>
<!-- row 1 -->
<path class="arc u" d="M216 152 a16 16 0 0 0 32 0"/>
<path class="arc n" d="M240 144 a16 16 0 0 1 32 0"/>
<path class="arc u" d="M296 152 a16 16 0 0 0 32 0"/>
<path class="arc n" d="M320 144 a16 16 0 0 1 32 0"/>
<path class="arc u" d="M376 152 a16 16 0 0 0 32 0"/>
<path class="arc n" d="M400 144 a16 16 0 0 1 32 0"/>
<!-- row 2 -->
<path class="arc u" d="M256 232 a16 16 0 0 0 32 0"/>
<path class="arc n" d="M280 224 a16 16 0 0 1 32 0"/>
<path class="arc u" d="M336 232 a16 16 0 0 0 32 0"/>
<path class="arc n" d="M360 224 a16 16 0 0 1 32 0"/>
<path class="arc u" d="M416 232 a16 16 0 0 0 32 0"/>
<path class="arc n" d="M440 224 a16 16 0 0 1 32 0"/>
</svg>
</div>
<div class="words">
<h1 class="name">TOU</h1>
<p class="tag">Um design system para o CRM e para o site: uma marca, um azul.</p>
</div>
</div>
</body>
</html>
